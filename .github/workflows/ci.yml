name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mongodb:
        image: mongo:8
        ports: ['27017:27017']
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CYPRESS_INSTALL_BINARY: '0'
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/myconvertertool_ci_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install conversion test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript libreoffice-writer fonts-dejavu-core
          gs --version
          soffice --version
      - run: npx puppeteer browsers install chrome
      - name: Check deployment safeguards
        run: |
          for script in scripts/deploy/*.sh; do bash -n "$script"; done
          node --test tests/deploy/*.test.mjs
      - run: node --test vendor/deepmerge/security.test.cjs server/tests/middleware.node-test.mjs server/tests/seo.node-test.mjs
      - run: npm test --workspace server
      - run: npm test --workspace client
      - run: npm run lint --workspace client
      - run: npm run test:markdown --workspace server
      - run: npm run build --workspace client
      - run: node scripts/check-prerender.mjs
      - run: npm audit
      - name: Package the tested release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash scripts/deploy/package.sh "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: production-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://myconvertertool.com
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Skip a superseded commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit is on main; skipping this deployment.'
          fi
      - uses: actions/download-artifact@v4
        if: steps.latest.outputs.deploy == 'true'
        with:
          name: production-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Configure authenticated SSH
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
      - name: Deploy and verify the tested artifact
        if: steps.latest.outputs.deploy == 'true'
        run: bash scripts/deploy/send.sh "$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$RUNNER_TEMP/release"
      - name: Remove SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
