<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>You're offline | MyConverterTool</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.25rem; }
      main { width: min(100%, 30rem); padding: 2rem; border: 1px solid #e2e8f0; border-radius: 1.5rem; background: white; box-shadow: 0 18px 50px #0f172a12; text-align: center; }
      img { width: 4rem; height: 4rem; }
      h1 { margin: 1.25rem 0 .5rem; font-size: 1.75rem; letter-spacing: -.04em; }
      p { color: #475569; line-height: 1.7; }
      button { min-height: 2.8rem; margin-top: .75rem; padding: .7rem 1.1rem; border: 0; border-radius: .8rem; background: #2563eb; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      @media (prefers-color-scheme: dark) { :root { background: #0f172a; color: #f8fafc; } main { border-color: #334155; background: #1e293b; } p { color: #cbd5e1; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/android-chrome-192x192.png" alt="" />
      <h1>You're offline</h1>
      <p>Reconnect to continue. Pages you have already opened may still be available. File conversions need an internet connection, while some text and developer tools can work in your browser.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
