services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "5000:5000"
    env_file: server/.env
    environment:
      MONGODB_URI: mongodb://db:27017/myconvertertool
    depends_on:
      - db
  db:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
